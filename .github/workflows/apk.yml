name: Build APK
on:
  push:
    branches: [main]
    paths:
      - 'client/**'
      - 'packages/**'
      - 'pnpm-lock.yaml'
      - '.github/workflows/apk.yml'
  workflow_dispatch:

concurrency:
  group: apk-${{ github.ref }}
  cancel-in-progress: true

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: pnpm }
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: 21, cache: gradle }
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter "client..." build
        env:
          VITE_API_ORIGIN: https://barra-bodega.onrender.com
      - run: pnpm --filter client exec cap sync android
      - run: cd client/android && chmod +x gradlew && ./gradlew assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: app-debug-${{ github.sha }}
          path: client/android/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 7
